<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notices | El-7areefa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<header class="headerContainer">
  <div class="header">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="El-7areefa">
    </a>
    <div class="headerLinks">
      <a class="upperbtn" href="index.html">Home</a>
      <a class="upperbtn" href="notices.html">Notices</a>
    </div>
  </div>
</header>

<main class="players-page">
  <h2 style="text-align:center; margin-bottom:20px;">🔔 Latest Notices</h2>

  <div class="players-grid" id="noticeGrid"></div>
</main>

<footer class="footerContainer">
  <div class="footer">© 2026 El-7areefa</div>
</footer>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyA4yfl48U9agGiK_tGhnNmvBV7qZu47NzE",
  authDomain: "el-7areefa-ac2fb.firebaseapp.com",
  projectId: "el-7areefa-ac2fb"
});

const db = firebase.firestore();
const grid = document.getElementById("noticeGrid");

db.collection("notifications")
  .orderBy("createdAt", "desc")
  .get()
  .then(snapshot => {
    if (snapshot.empty) {
      grid.innerHTML = "<p>No notices yet.</p>";
      return;
    }

    snapshot.forEach(doc => {
      const n = doc.data();
      grid.innerHTML += `
        <div class="player-card">
          <h3>${n.title}</h3>
          <p>${n.message}</p>
        </div>
      `;
    });
  })
  .catch(err => {
    console.error(err);
    grid.innerHTML = "<p>Error loading notices.</p>";
  });
</script>

</body>
</html>
