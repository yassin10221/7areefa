<script>
function addGoal(playerName) {
  const now = firebase.firestore.FieldValue.serverTimestamp();

  // 1️⃣ Add goal
  db.collection("goals").add({
    playerId: playerName,
    createdAt: now
  })
  .then(() => {

    // 2️⃣ Auto-add notification
    return db.collection("notifications").add({
      title: "⚽ Goal Scored!",
      message: `${playerName} scored a new goal!`,
      createdAt: now
    });

  })
  .then(() => {
    console.log("Goal + notification added");
  })
  .catch(err => {
    console.error("Error:", err);
  });
}
</script>
