<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
/* 🔥 Firebase Init */
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "el-7areefa-ac2fb.firebaseapp.com",
  projectId: "el-7areefa-ac2fb"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* 🔎 Get player id */
const params = new URLSearchParams(window.location.search);
const playerId = params.get("id");

/* 🔐 Admin check */
let isAdmin = false;

auth.onAuthStateChanged(user => {
  if (!user) return;

  db.collection("admins").doc(user.uid).get().then(doc => {
    if (doc.exists) {
      isAdmin = true;
      document.getElementById("addGoalBtn").style.display = "block";
    }
  });
});

/* 👤 Load player */
function loadPlayer() {
  db.collection("players").doc(playerId).get().then(doc => {
    if (!doc.exists) return;

    const p = doc.data();
    document.getElementById("card").style.display = "flex";
    document.getElementById("name").innerText = p.name;
    document.getElementById("overall").innerText = p.overall;
    document.getElementById("position").innerText = p.position;
    document.getElementById("playerImage").src = p.image;

    const stats = document.getElementById("statsContainer");
    stats.innerHTML = p.position === "GK"
      ? `
        <p>DIV <span>${p.diving}</span></p>
        <p>HAN <span>${p.handling}</span></p>
        <p>KIC <span>${p.kick}</span></p>
        <p>REF <span>${p.reflexes}</span></p>
        <p>SPD <span>${p.speed}</span></p>
        <p>POS <span>${p.positioning}</span></p>`
      : `
        <p>PAC <span>${p.pace}</span></p>
        <p>SHO <span>${p.shooting}</span></p>
        <p>PAS <span>${p.passing}</span></p>
        <p>DRI <span>${p.dribbling}</span></p>
        <p>DEF <span>${p.defending}</span></p>
        <p>PHY <span>${p.physical}</span></p>`;

    listenToGoals();
  });
}

/* ⚽ Goals counter */
function listenToGoals() {
  db.collection("goals")
    .where("playerId", "==", playerId)
    .onSnapshot(snap => {
      document.getElementById("goalCount").innerText =
        "⚽ Goals: " + snap.size;
    });
}

/* ➕ Add goal (ADMIN ONLY) */
function addGoalToPlayer() {
  if (!isAdmin) {
    alert("Admins only");
    return;
  }

  db.collection("goals").add({
    playerId: playerId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* 🚀 Start */
if (playerId) loadPlayer();
</script>
